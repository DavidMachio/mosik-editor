<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Mosik Beads: crea tu propio diseño de cuentas para planchar." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mosik Beads</title>
    <script>
      // Aplica el tema guardado antes de pintar la página, para evitar un parpadeo.
      try {
        var t = localStorage.getItem('mosik-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
